<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fordham Service Station Rota</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fordham Service Station">
<meta name="theme-color" content="#0F1B2D">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230F1B2D'/><text x='50' y='64' font-size='54' text-anchor='middle' fill='%23F5A623' font-family='Arial' font-weight='900'>R</text></svg>">
<style>
  :root{
    --navy:#0F1B2D;
    --navy-2:#16263D;
    --teal:#1F3A3D;
    --amber:#F5A623;
    --amber-dim:#C6821A;
    --cream:#F7F5F0;
    --off:#8AA0AE;
    --off-line:#28394D;
    --green:#7FD858;
    --red:#E5556B;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:var(--navy);
    color:var(--cream);
    font-family:'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:40px;
    min-height:100vh;
  }
  button{ font-family:inherit; cursor:pointer; }

  /* ---------- Login screen ---------- */
  #loginScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:60px 24px 24px;
    text-align:center;
  }
  .login-title{
    font-size:22px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .login-title .amber{ color:var(--amber); }
  .login-sub{
    font-size:16px;
    color:var(--off);
    margin:10px 0 28px;
  }
  .pin-dots{
    display:flex;
    gap:16px;
    margin-bottom:32px;
  }
  .pin-dot{
    width:20px; height:20px;
    border-radius:50%;
    border:2px solid var(--off-line);
    background:transparent;
  }
  .pin-dot.filled{ background:var(--amber); border-color:var(--amber); }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    width:100%;
    max-width:320px;
  }
  .key-btn{
    background:var(--navy-2);
    border:1px solid var(--off-line);
    color:var(--cream);
    font-size:28px;
    font-weight:700;
    border-radius:16px;
    padding:22px 0;
  }
  .key-btn:active{ background:var(--teal); }
  .key-btn.wide{ font-size:16px; font-weight:800; color:var(--off); }
  .login-status{
    margin-top:20px;
    font-size:15px;
    min-height:20px;
  }
  .login-status.err{ color:var(--red); }

  /* ---------- Home screen ---------- */
  #homeScreen{ padding:0 16px 30px; }
  .top-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 0 14px;
    border-bottom:1px solid var(--off-line);
    margin-bottom:14px;
  }
  .hi-name{
    font-size:20px;
    font-weight:800;
  }
  .hi-name .amber{ color:var(--amber); }
  #switchUserBtn{
    background:var(--navy-2);
    border:1px solid var(--off-line);
    color:var(--off);
    font-size:13px;
    font-weight:700;
    padding:9px 14px;
    border-radius:100px;
  }

  .hero{
    background:linear-gradient(135deg, var(--teal), var(--navy-2));
    border:1px solid var(--off-line);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .hero.now{
    background:linear-gradient(135deg, #1B2E1A, var(--navy-2));
    border-color:#3A5A34;
  }
  .hero .eyebrow{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--amber);
    font-weight:800;
    margin-bottom:8px;
  }
  .hero.now .eyebrow{ color:var(--green); }
  .now-row{ display:flex; justify-content:space-between; font-size:16px; padding:3px 0; }
  .now-row .dot{ width:9px; height:9px; border-radius:50%; background:var(--green); display:inline-block; margin-right:8px; }
  .now-empty{ font-size:15px; color:var(--off); font-style:italic; }

  .section-title{
    font-size:15px;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--amber);
    margin:20px 0 10px;
  }

  .shift-card{
    background:var(--navy-2);
    border:1px solid var(--off-line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
  }
  .shift-card.logged{ border-color:#3A5A34; background:rgba(127,216,88,0.06); }
  .shift-card-time{ font-size:20px; font-weight:800; margin-bottom:4px; }
  .shift-card-tag{ font-size:13px; color:var(--amber); font-weight:800; text-transform:uppercase; }
  .logged-display{
    font-size:16px;
    color:var(--green);
    font-weight:700;
    margin-top:8px;
  }
  .big-btn{
    width:100%;
    background:var(--amber);
    color:var(--navy);
    border:none;
    padding:18px;
    border-radius:14px;
    font-size:18px;
    font-weight:800;
    margin-top:10px;
  }
  .big-btn.secondary{
    background:var(--teal);
    color:var(--cream);
    border:1px solid var(--amber-dim);
  }
  .no-shift-text{ font-size:15px; color:var(--off); font-style:italic; }

  .log-panel{
    margin-top:14px;
    padding-top:14px;
    border-top:1px dashed var(--off-line);
  }
  .log-panel label{
    display:block;
    font-size:13px;
    color:var(--off);
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-weight:700;
    margin-bottom:6px;
  }
  .log-panel .row{ display:flex; gap:10px; margin-bottom:14px; }
  .log-panel input[type=time]{
    flex:1;
    background:var(--navy);
    border:1px solid var(--off-line);
    color:var(--cream);
    padding:14px;
    border-radius:10px;
    font-size:18px;
  }
  .log-status{ font-size:14px; text-align:center; margin-top:10px; min-height:18px; }
  .log-status.ok{ color:var(--green); }
  .log-status.err{ color:var(--red); }

  /* ---------- Month view ---------- */
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin:6px 0 12px;
  }
  .month-nav-btn{
    background:var(--navy-2);
    border:1px solid var(--off-line);
    color:var(--cream);
    width:40px; height:40px;
    border-radius:10px;
    font-size:20px;
    font-weight:800;
  }
  .month-label{ font-size:17px; font-weight:800; }

  .month-total-card{
    background:var(--teal);
    border:1px solid var(--off-line);
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
  }
  .month-total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:15px;
  }
  .month-total-row + .month-total-row{ margin-top:6px; }
  .month-total-row b{ font-size:19px; }
  .month-total-row .over{ color:var(--red); }
  .month-total-row .under{ color:#FFD966; }

  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
  }
  .month-weekday{
    text-align:center;
    font-size:10px;
    font-weight:800;
    color:var(--off);
    text-transform:uppercase;
    padding-bottom:4px;
  }
  .month-cell{
    aspect-ratio:0.85;
    border:1px solid var(--off-line);
    border-radius:6px;
    background:var(--navy-2);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:2px 1px;
  }
  .month-cell.empty{ border-color:transparent; background:none; }
  .month-cell.off-day{ background:#0A1420; }
  .month-cell.is-today{ border-color:var(--amber); border-width:2px; }
  .month-date{ font-size:10px; font-weight:700; color:var(--off); }
  .month-cell.working .month-date{ color:var(--cream); }
  .month-cell-nums{ font-size:8.5px; line-height:1.3; text-align:center; margin-top:1px; }
  .month-cell-nums .sch{ color:var(--off); }
  .month-cell-nums .log{ font-weight:800; }
  .month-cell-nums .log.over{ color:var(--red); }
  .month-cell-nums .log.under{ color:#FFD966; }
  .month-cell-nums .log.match{ color:var(--green); }
  .month-legend{
    font-size:11px;
    color:var(--off);
    text-align:center;
    margin-top:10px;
  }
  .month-legend span{ font-weight:800; padding:0 3px; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-title"><span class="amber">Fordham</span> Service Station</div>
  <div class="login-sub">Enter your 4-digit PIN</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div><div class="pin-dot"></div>
  </div>
  <div class="keypad" id="keypad">
    <button class="key-btn" data-key="1">1</button>
    <button class="key-btn" data-key="2">2</button>
    <button class="key-btn" data-key="3">3</button>
    <button class="key-btn" data-key="4">4</button>
    <button class="key-btn" data-key="5">5</button>
    <button class="key-btn" data-key="6">6</button>
    <button class="key-btn" data-key="7">7</button>
    <button class="key-btn" data-key="8">8</button>
    <button class="key-btn" data-key="9">9</button>
    <button class="key-btn wide" data-key="clear">Clear</button>
    <button class="key-btn" data-key="0">0</button>
    <button class="key-btn wide" data-key="back">⌫</button>
  </div>
  <div class="login-status" id="loginStatus"></div>
</div>

<div id="homeScreen" class="hidden">
  <div class="top-header">
    <div class="hi-name">Hi <span class="amber" id="hiNameSpan"></span></div>
    <button id="switchUserBtn">Switch user</button>
  </div>

  <div id="nowBanner" class="hero now"></div>

  <div class="section-title">Log my time</div>
  <div id="todayShiftsList"></div>

  <div class="section-title">My month</div>
  <div class="month-nav">
    <button class="month-nav-btn" id="monthPrev">‹</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="month-nav-btn" id="monthNext">›</button>
  </div>
  <div class="month-total-card" id="monthTotalCard"></div>
  <div class="month-grid" id="monthGrid"></div>
  <div class="month-legend">
    <span style="color:var(--red);">Red</span> = worked more &nbsp;
    <span style="color:#FFD966;">Yellow</span> = worked less &nbsp;
    <span style="color:var(--green);">Green</span> = matched
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSLwIlHMB0Ej3kMePYtUJP97MTXvj3X5I",
  authDomain: "fordhamrota.firebaseapp.com",
  projectId: "fordhamrota",
  storageBucket: "fordhamrota.firebasestorage.app",
  messagingSenderId: "441480189702",
  appId: "1:441480189702:web:8c0124f191e5776c19b087"
};

let firebaseReady = false;
let fbApp, fbDb;
try {
  fbApp = initializeApp(firebaseConfig);
  fbDb = getFirestore(fbApp);
  firebaseReady = true;
} catch(e) {
  console.warn('Firebase init failed, using local data only', e);
}

const DEFAULT_STAFF = ["Alex","Regi","Jude","Seran","Uday"];
let STAFF = [...DEFAULT_STAFF];

function blankWeek(){
  return Array.from({length:7}, () => ({ off: true, total: 0 }));
}
function hydrateStaffData(){
  STAFF.forEach(name => {
    if (!DEFAULT_DATA[name]) DEFAULT_DATA[name] = blankWeek();
    if (!DATA[name]) DATA[name] = blankWeek();
  });
}

const DAYS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const DAY_FULL = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const SHORT_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let DEFAULT_DATA = {
  Alex: [
    {shifts:[{start:"05:30",end:"13:00"},{start:"14:00",end:"17:00"}], total:10.5},
    {shifts:[{start:"05:30",end:"14:00"},{start:"17:00",end:"22:00"}], total:13.5},
    {off:true, total:0},
    {shifts:[{start:"05:30",end:"14:00"}], total:8.5},
    {shifts:[{start:"05:30",end:"13:00"},{start:"15:00",end:"21:00"}], total:13.5},
    {shifts:[{start:"05:30",end:"14:00"}], total:8.5},
    {shifts:[{start:"05:30",end:"13:00"}], total:7.5}
  ],
  Regi: [
    {shifts:[{start:"13:00",end:"21:00"}], total:8},
    {shifts:[{start:"14:00",end:"21:00"}], total:7},
    {shifts:[{start:"05:30",end:"13:00"}], total:7.5},
    {off:true, total:0},
    {shifts:[{start:"08:00",end:"15:00"}], total:7},
    {off:true, total:0},
    {off:true, total:0}
  ],
  Jude: [
    {shifts:[{start:"08:00",end:"13:00"},{start:"17:00",end:"22:00"}], total:10},
    {off:true, total:0},
    {shifts:[{start:"13:00",end:"21:00"}], total:8},
    {shifts:[{start:"—",end:"—",tag:"Delivery (4h)"},{start:"17:00",end:"22:00"}], total:9},
    {shifts:[{start:"13:00",end:"22:00"}], total:9},
    {shifts:[{start:"14:00",end:"21:00"}], total:7},
    {shifts:[{start:"09:00",end:"14:00"},{start:"16:00",end:"22:00"}], total:11}
  ],
  Seran: [
    {shifts:[{start:"—",end:"—",tag:"Delivery (5h)"}], total:5},
    {shifts:[{start:"08:00",end:"17:00"}], total:9},
    {off:true, total:0},
    {shifts:[{start:"08:00",end:"17:00"}], total:9},
    {off:true, total:0},
    {off:true, total:0},
    {off:true, total:0}
  ],
  Uday: [
    {off:true, total:0},
    {off:true, total:0},
    {shifts:[{start:"08:00",end:"22:00"}], total:14},
    {shifts:[{start:"14:00",end:"21:00"}], total:7},
    {off:true, total:0},
    {shifts:[{start:"08:00",end:"22:00"}], total:14},
    {shifts:[{start:"14:00",end:"20:00"}], total:6}
  ]
};

let DATA = DEFAULT_DATA;

function todayIndex(){
  const d = new Date().getDay();
  return d === 0 ? 6 : d - 1;
}
const TODAY = todayIndex();

function toMinutes(hhmm){
  if (!hhmm || hhmm === "—") return null;
  const [h,m] = hhmm.split(':').map(Number);
  return h*60+m;
}

function mondayOf(date){
  const d = new Date(date);
  const jsDay = d.getDay();
  const diff = jsDay === 0 ? -6 : 1 - jsDay;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function weekKey(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,'0');
  const d = String(date.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

async function resolveWeekDataFor(mondayDate){
  if (!firebaseReady) return DEFAULT_DATA;
  try {
    const snap = await getDoc(doc(fbDb, 'rota', `week_${weekKey(mondayDate)}`));
    if (snap.exists() && snap.data().json){
      const parsed = JSON.parse(snap.data().json);
      STAFF.forEach(name => { if (!parsed[name]) parsed[name] = blankWeek(); });
      return parsed;
    }
  } catch(e) {
    console.warn('Could not resolve a week, using default pattern', e);
  }
  return DEFAULT_DATA;
}

async function loadStaffList(){
  if (!firebaseReady) return;
  try {
    const snap = await getDoc(doc(fbDb, 'rota', 'staff_list'));
    if (snap.exists() && Array.isArray(snap.data().names) && snap.data().names.length){
      STAFF = snap.data().names;
      hydrateStaffData();
    }
  } catch(e) {
    console.warn('Could not load staff list', e);
  }
}

// ============================================================
// LOGIN
// ============================================================
let pinBuffer = '';
let loggedInPerson = null;

function updatePinDots(){
  document.querySelectorAll('.pin-dot').forEach((dot, i) => {
    dot.classList.toggle('filled', i < pinBuffer.length);
  });
}

document.querySelectorAll('.key-btn').forEach(btn => {
  btn.onclick = () => {
    const k = btn.dataset.key;
    if (k === 'clear'){ pinBuffer = ''; }
    else if (k === 'back'){ pinBuffer = pinBuffer.slice(0, -1); }
    else if (pinBuffer.length < 4){ pinBuffer += k; }
    updatePinDots();
    if (pinBuffer.length === 4) checkPin();
  };
});

async function checkPin(){
  const statusEl = document.getElementById('loginStatus');
  statusEl.className = 'login-status';
  statusEl.textContent = 'Checking…';
  try {
    const snap = await getDoc(doc(fbDb, 'staff_pins', 'all'));
    const pins = snap.exists() ? snap.data() : {};
    const match = Object.keys(pins).find(name => pins[name] === pinBuffer);
    if (match && STAFF.includes(match)){
      loggedInPerson = match;
      try { localStorage.setItem('rota_logged_in_person', match); } catch(e) {}
      statusEl.textContent = '';
      pinBuffer = '';
      updatePinDots();
      showHome();
    } else {
      statusEl.className = 'login-status err';
      statusEl.textContent = 'PIN not recognized. Try again.';
      pinBuffer = '';
      updatePinDots();
    }
  } catch(e) {
    statusEl.className = 'login-status err';
    statusEl.textContent = 'Could not check PIN: ' + e.message;
    pinBuffer = '';
    updatePinDots();
  }
}

document.getElementById('switchUserBtn').onclick = () => {
  if (!confirm('Switch to a different user? You will need to enter a PIN again.')) return;
  loggedInPerson = null;
  try { localStorage.removeItem('rota_logged_in_person'); } catch(e) {}
  document.getElementById('homeScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
};

// ============================================================
// HOME SCREEN
// ============================================================
async function showHome(){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('homeScreen').classList.remove('hidden');
  document.getElementById('hiNameSpan').textContent = loggedInPerson;

  await loadStaffList();

  const thisMonday = mondayOf(new Date());
  DATA = await resolveWeekDataFor(thisMonday);
  hydrateStaffData();

  renderNowBanner();
  renderTodayShifts();
  renderMonthView();
}

function renderNowBanner(){
  const el = document.getElementById('nowBanner');
  const nowMin = new Date().getHours()*60 + new Date().getMinutes();
  const onNow = [];
  STAFF.forEach(name => {
    const day = DATA[name] ? DATA[name][TODAY] : null;
    if (!day || day.off || !day.shifts) return;
    day.shifts.forEach(s => {
      const start = toMinutes(s.start), end = toMinutes(s.end);
      if (start === null || end === null) return;
      if (nowMin >= start && nowMin < end) onNow.push({ name, until: s.end });
    });
  });
  if (onNow.length === 0){
    el.innerHTML = `<div class="eyebrow">Working right now</div><div class="now-empty">Nobody currently on shift</div>`;
    return;
  }
  const rows = onNow.map(p => `<div class="now-row"><span><span class="dot"></span>${p.name}</span><span>till ${p.until}</span></div>`).join('');
  el.innerHTML = `<div class="eyebrow">Working right now</div>${rows}`;
}

function todayDateStr(){
  return weekKey(new Date());
}

async function fetchLoggedTime(docId){
  try {
    const snap = await getDoc(doc(fbDb, 'timesheets', docId));
    return snap.exists() ? snap.data() : null;
  } catch(e) { return null; }
}

async function renderTodayShifts(){
  const el = document.getElementById('todayShiftsList');
  el.innerHTML = '';
  const day = DATA[loggedInPerson] ? DATA[loggedInPerson][TODAY] : null;

  if (!day || day.off || !day.shifts || day.shifts.length === 0){
    el.innerHTML = `<div class="shift-card"><div class="no-shift-text">You're not scheduled to work today.</div></div>`;
    return;
  }

  for (let si = 0; si < day.shifts.length; si++){
    const s = day.shifts[si];
    const docId = `${loggedInPerson}_${todayDateStr()}_${si}`;
    const existing = await fetchLoggedTime(docId);

    const card = document.createElement('div');
    card.className = 'shift-card' + (existing ? ' logged' : '');
    const timeLabel = s.tag ? `<div class="shift-card-tag">${s.tag}</div>` : `<div class="shift-card-time">${s.start} – ${s.end}</div>`;
    const loggedHtml = existing ? `<div class="logged-display">Logged: ${existing.actualStart} – ${existing.actualEnd}</div>` : '';
    const btnLabel = existing ? 'Edit my time' : 'Log my time';

    card.innerHTML = `
      ${timeLabel}
      ${loggedHtml}
      <button class="big-btn ${existing ? 'secondary' : ''}" data-doc="${docId}" data-defstart="${s.start}" data-defend="${s.end}">${btnLabel}</button>
      <div class="log-panel hidden" id="panel-${docId}"></div>
    `;
    el.appendChild(card);
  }

  el.querySelectorAll('.big-btn[data-doc]').forEach(btn => {
    btn.onclick = () => toggleLogPanel(btn);
  });
}

async function toggleLogPanel(btn){
  const docId = btn.dataset.doc;
  const panel = document.getElementById(`panel-${docId}`);
  const isHidden = panel.classList.contains('hidden');
  document.querySelectorAll('.log-panel').forEach(p => p.classList.add('hidden'));
  if (!isHidden) return;

  const existing = await fetchLoggedTime(docId);
  const defStart = btn.dataset.defstart === "—" ? "" : btn.dataset.defstart;
  const defEnd = btn.dataset.defend === "—" ? "" : btn.dataset.defend;
  const startVal = existing ? existing.actualStart : defStart;
  const endVal = existing ? existing.actualEnd : defEnd;

  panel.innerHTML = `
    <label>Start time</label>
    <div class="row"><input type="time" class="log-start-input" value="${startVal}" min="05:30" max="22:00"></div>
    <label>End time</label>
    <div class="row"><input type="time" class="log-end-input" value="${endVal}" min="05:30" max="22:00"></div>
    <button class="big-btn log-save-btn">Save</button>
    <div class="log-status"></div>
  `;
  panel.classList.remove('hidden');

  panel.querySelector('.log-save-btn').onclick = async () => {
    const statusEl = panel.querySelector('.log-status');
    const actualStart = panel.querySelector('.log-start-input').value;
    const actualEnd = panel.querySelector('.log-end-input').value;

    if (!actualStart || !actualEnd){
      statusEl.className = 'log-status err';
      statusEl.textContent = 'Enter both start and end time.';
      return;
    }

    const SHOP_OPEN = 5*60+30, SHOP_CLOSE = 22*60;
    const sm = toMinutes(actualStart), em = toMinutes(actualEnd);
    if (sm < SHOP_OPEN || sm > SHOP_CLOSE || em < SHOP_OPEN || em > SHOP_CLOSE){
      if (!confirm(`This is outside shop hours (05:30–22:00). You entered ${actualStart}–${actualEnd}. Save anyway?`)) {
        statusEl.textContent = 'Not saved.';
        return;
      }
    }
    const defStart = btn.dataset.defstart, defEnd = btn.dataset.defend;
    if (defStart !== "—" && (actualStart !== defStart || actualEnd !== defEnd)){
      if (!confirm(`You were scheduled ${defStart}–${defEnd}, but entered ${actualStart}–${actualEnd}. Is this correct?`)) {
        statusEl.textContent = 'Not saved.';
        return;
      }
    }

    statusEl.className = 'log-status';
    statusEl.textContent = 'Saving…';
    try {
      await setDoc(doc(fbDb, 'timesheets', docId), {
        person: loggedInPerson, date: todayDateStr(),
        scheduledStart: btn.dataset.defstart, scheduledEnd: btn.dataset.defend,
        actualStart, actualEnd,
        loggedAt: new Date().toISOString()
      });
      statusEl.className = 'log-status ok';
      statusEl.textContent = 'Saved.';
      renderTodayShifts();
    } catch(e) {
      statusEl.className = 'log-status err';
      statusEl.textContent = 'Save failed: ' + e.message;
    }
  };
}

// ============================================================
// MONTH VIEW (allocated + logged, per day)
// ============================================================
const _now = new Date();
let viewedMonth = _now.getMonth();
let viewedYear = _now.getFullYear();

async function fetchMonthLoggedHours(person, year, month){
  const start = weekKey(new Date(year, month, 1));
  const end = weekKey(new Date(year, month + 1, 0));
  const result = {};
  if (!firebaseReady) return result;
  try {
    const q = query(collection(fbDb, 'timesheets'), where('person','==',person), where('date','>=',start), where('date','<=',end));
    const snap = await getDocs(q);
    snap.forEach(docSnap => {
      const d = docSnap.data();
      const sm = toMinutes(d.actualStart), em = toMinutes(d.actualEnd);
      if (sm !== null && em !== null){
        result[d.date] = (result[d.date] || 0) + Math.round(((em - sm) / 60) * 100) / 100;
      }
    });
  } catch(e) {
    console.warn('Could not fetch logged hours for month', e);
  }
  return result;
}

async function renderMonthView(){
  document.getElementById('monthLabel').textContent = `${MONTH_NAMES[viewedMonth]} ${viewedYear}`;
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';
  DAYS.forEach(d => {
    const el = document.createElement('div');
    el.className = 'month-weekday';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstOfMonth = new Date(viewedYear, viewedMonth, 1);
  const daysInMonth = new Date(viewedYear, viewedMonth + 1, 0).getDate();
  const firstJsDay = firstOfMonth.getDay();
  const leadingBlanks = firstJsDay === 0 ? 6 : firstJsDay - 1;
  for (let i = 0; i < leadingBlanks; i++){
    const blank = document.createElement('div');
    blank.className = 'month-cell empty';
    grid.appendChild(blank);
  }

  const today = new Date();
  const isCurrentMonth = today.getMonth() === viewedMonth && today.getFullYear() === viewedYear;

  // Resolve each week's schedule for this month
  const weekDataCache = {};
  for (let date = 1; date <= daysInMonth; date++){
    const cellDate = new Date(viewedYear, viewedMonth, date);
    const mondayKey = weekKey(mondayOf(cellDate));
    if (!(mondayKey in weekDataCache)){
      weekDataCache[mondayKey] = await resolveWeekDataFor(mondayOf(cellDate));
    }
  }

  const loggedMap = await fetchMonthLoggedHours(loggedInPerson, viewedYear, viewedMonth);

  let monthAlloc = 0, monthLogged = 0;

  for (let date = 1; date <= daysInMonth; date++){
    const cellDate = new Date(viewedYear, viewedMonth, date);
    const jsDay = cellDate.getDay();
    const weekdayIdx = jsDay === 0 ? 6 : jsDay - 1;
    const mondayKey = weekKey(mondayOf(cellDate));
    const weekData = weekDataCache[mondayKey];
    const day = (weekData[loggedInPerson] && weekData[loggedInPerson][weekdayIdx])
      ? weekData[loggedInPerson][weekdayIdx]
      : DEFAULT_DATA[loggedInPerson][weekdayIdx];

    const dateStr = weekKey(cellDate);
    const logged = loggedMap[dateStr] || 0;
    monthAlloc += day.total;
    monthLogged += logged;

    let logCls = 'match';
    if (logged > day.total) logCls = 'over';
    else if (logged < day.total) logCls = 'under';

    const cell = document.createElement('div');
    cell.className = 'month-cell' + (day.off ? ' off-day' : ' working') + (isCurrentMonth && date === today.getDate() ? ' is-today' : '');
    cell.innerHTML = `
      <div class="month-date">${date}</div>
      <div class="month-cell-nums">
        <div class="sch">${day.off ? '–' : day.total + 'h'}</div>
        ${logged > 0 ? `<div class="log ${logCls}">${logged}h</div>` : ''}
      </div>
    `;
    grid.appendChild(cell);
  }

  const totalCard = document.getElementById('monthTotalCard');
  let totalCls = 'match';
  if (monthLogged > monthAlloc) totalCls = 'over';
  else if (monthLogged < monthAlloc) totalCls = 'under';
  totalCard.innerHTML = `
    <div class="month-total-row"><span>Allocated this month</span><b>${monthAlloc}h</b></div>
    <div class="month-total-row"><span>Logged this month</span><b class="${totalCls}">${monthLogged}h</b></div>
  `;
}

document.getElementById('monthPrev').onclick = () => {
  viewedMonth--;
  if (viewedMonth < 0){ viewedMonth = 11; viewedYear--; }
  renderMonthView();
};
document.getElementById('monthNext').onclick = () => {
  viewedMonth++;
  if (viewedMonth > 11){ viewedMonth = 0; viewedYear++; }
  renderMonthView();
};
